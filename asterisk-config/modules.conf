; ============================================================================
; modules.conf
; ============================================================================
;
; autoload=yes means Asterisk loads every module it finds, except those
; explicitly noload'd below.
;
; We use noload for modules we don't want, and explicit `load =>` for
; modules that should load even if autoload doesn't pick them up.
; ============================================================================

[modules]
autoload=yes

; --- PostgreSQL backends ---
; cdr_pgsql and cel_pgsql load automatically because cdr_pgsql.conf and
; cel_pgsql.conf exist. If either module fails to load, check that its
; config file has a valid [global] section.

; --- Disable modules we don't use ---
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so

; --- Ensure the realtime drivers we're NOT using don't try to connect ---
; res_config_ldap and res_config_pgsql are separate from cdr_pgsql and
; cel_pgsql. We don't use Asterisk Realtime, so disable them to avoid
; startup warnings about missing database credentials.
noload = res_config_ldap.so
;noload = res_config_pgsql.so
