; ============================================================================
; cdr.conf
; ============================================================================
;
; Global CDR engine settings. The actual backend selection is done by
; which backend config files exist (cdr_pgsql.conf, cdr_csv.conf, etc.).
;
; We use cdr_pgsql for structured data. cdr_csv is disabled by not
; providing a [csv] section here.
; ============================================================================

[general]
enable=yes
unanswered=yes
congestion=yes
endbeforehexten=yes
initiatedseconds=no
batch=no
safeshutdown=yes
