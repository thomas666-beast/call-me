; ============================================================================
; cel.conf — Channel Event Logging
; ============================================================================
;
; CEL records channel-level events: CHAN_START, ANSWER, BRIDGE_ENTER, HANGUP,
; TRANSFER, etc. Many rows per call.
;
; Unlike CDR, CEL is DISABLED by default. `enable=yes` here is what makes
; Asterisk emit events at all. Without it, cel_pgsql.so loads but receives
; nothing.
;
; The `events` list controls which events are logged. `ALL` captures
; everything, which is what we want for call center analysis.
; ============================================================================

[general]
enable = yes
apps = all
events = ALL

; ---------------------------------------------------------------------------
; Backends are configured in their own files:
;   cel_pgsql.conf  -> writes to PostgreSQL (our cel table)
;   cel_manager.conf -> writes to AMI (not used)
;   cel_odbc.conf    -> writes via ODBC (not used)
;
; No [manager] or [radius] sections here. We only use the pgsql backend.
; ---------------------------------------------------------------------------
