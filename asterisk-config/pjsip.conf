; ============================================================================
; pjsip.conf — Main PJSIP configuration
; ============================================================================
;
; This file is STATIC. It does not change when extensions are added or removed.
; All dynamic content lives in pjsip_extensions.conf, which is included at the
; bottom of this file and is regenerated by the backend.
;
; Mounted from host: ./asterisk-config/pjsip.conf
; Loaded by Asterisk at startup and on `module reload res_pjsip.so`.
; ============================================================================

[global]
type=global
user_agent=CallCenter-Manager

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ----------------------------------------------------------------------------
; Generated content — do not edit by hand.
; Managed by the CallCenter Manager backend.
; ----------------------------------------------------------------------------
#include pjsip_extensions.conf
