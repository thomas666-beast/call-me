; ============================================================================
; cel_pgsql.conf — PostgreSQL Channel Event Logging Backend
; ============================================================================
;
; NOTE: the key is `user`, not `username`. Asterisk 22 will silently fall
; back to the default user "asterisk" if `user` is missing, and then fail
; authentication. This cost us a debugging session.
; ============================================================================

[global]
hostname = postgres
port     = 5432
dbname   = callcenter
user     = callcenter
password = f0d80ae22a43b69065d636c234e0a428
table    = cel
encoding = UTF8
timezone = UTC
