; ============================================================================
; extensions.conf — Dialplan
; ============================================================================
;
; Routing is convention-based:
;   _1XXX  -> dial an extension      (PJSIP/<number>)
;   _2XXX  -> enter a queue          (Queue(<number>))
;   _*XX   -> feature codes          (echo test)
;   _X.    -> catch-all              (invalid, hangup)
;
; All calls are recorded via MixMonitor. The filename uses ${UNIQUEID},
; which links the audio file to the CDR and CEL rows for the same call.
; ============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; ----------------------------------------------------------------------------
; Internal context — registered endpoints place outbound calls here.
; ----------------------------------------------------------------------------
[from-internal]

; -- Extension-to-extension calls (with recording) --
exten => _1XXX,1,NoOp(Internal call from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(MONITOR_FILENAME=${UNIQUEID})
 same => n,MixMonitor(${MONITOR_FILENAME}.wav,b)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; -- Queue calls (with recording) --
exten => _2XXX,1,NoOp(Queue call from ${CALLERID(num)} to queue ${EXTEN})
 same => n,Set(MONITOR_FILENAME=${UNIQUEID})
 same => n,MixMonitor(${MONITOR_FILENAME}.wav,b)
 same => n,Answer()
 same => n,Queue(${EXTEN})
 same => n,Hangup()

; -- Echo test — dial *43 --
exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; -- Catch-all --
exten => _X.,1,NoOp(Unknown extension ${EXTEN} from ${CALLERID(num)})
 same => n,Playback(invalid)
 same => n,Hangup()

; ----------------------------------------------------------------------------
; Queue exit context — callers who leave a queue without being answered.
; ----------------------------------------------------------------------------
[from-queue]

exten => s,1,NoOp(Queue caller dropped out)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
 